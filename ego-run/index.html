<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ego Run!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0a2e; touch-action: none; }
  #game-canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff; z-index: 10;
    background: radial-gradient(ellipse at center, rgba(26,10,46,0.55) 0%, rgba(26,10,46,0.85) 100%);
    user-select: none;
  }
  .hidden { display: none; }

  .title {
    font-size: clamp(52px, 12vw, 110px);
    font-weight: 900; font-style: italic;
    letter-spacing: 0.02em;
    background: linear-gradient(180deg, #ffe97a 0%, #ffb02e 45%, #ff5e7a 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 rgba(120, 20, 80, 0.9)) drop-shadow(0 10px 24px rgba(0,0,0,0.5));
    transform: skewX(-6deg);
  }
  .subtitle { font-size: clamp(14px, 3vw, 20px); opacity: 0.85; margin-top: 14px; letter-spacing: 0.25em; text-transform: uppercase; }
  .hint { font-size: clamp(13px, 2.6vw, 17px); opacity: 0.65; margin-top: 36px; line-height: 1.9; text-align: center; }
  .pulse { margin-top: 30px; font-size: clamp(16px, 3.4vw, 22px); font-weight: 700; color: #ffe97a; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.96); } }

  .big-score { font-size: clamp(44px, 10vw, 90px); font-weight: 900; color: #ffe97a; text-shadow: 0 4px 18px rgba(0,0,0,0.6); }
  .best { font-size: clamp(15px, 3vw, 20px); margin-top: 10px; opacity: 0.8; }
  .new-best { color: #7affc0; font-weight: 700; animation: pulse 1s ease-in-out infinite; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 20px; z-index: 5; pointer-events: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  }
  #hud-score { font-size: clamp(26px, 5.5vw, 40px); font-weight: 900; font-style: italic; }
  #hud-coins { font-size: clamp(18px, 4vw, 26px); font-weight: 700; color: #ffe97a; }

  .models-link {
    position: absolute; bottom: 22px; right: 24px;
    color: #fff; opacity: 0.6; font-size: 14px; text-decoration: none;
    border: 1px solid rgba(255,255,255,0.35); border-radius: 8px; padding: 8px 14px;
  }
  .models-link:hover { opacity: 1; border-color: #ffe97a; color: #ffe97a; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud" class="hidden">
  <div id="hud-score">0</div>
  <div id="hud-coins">&#9679; 0</div>
</div>

<div id="start-overlay" class="overlay">
  <div class="title">EGO RUN!</div>
  <div class="subtitle">outrun your own legend</div>
  <div class="hint">
    &#8592; &#8594; / A D &nbsp;&mdash;&nbsp; switch lanes<br>
    &#8593; / SPACE &nbsp;&mdash;&nbsp; jump &nbsp;&nbsp;&nbsp; &#8595; / S &nbsp;&mdash;&nbsp; slide<br>
    swipe on mobile
  </div>
  <div class="pulse">press any key to run</div>
  <a class="models-link" href="models.html">view 3D models &#8594;</a>
</div>

<div id="over-overlay" class="overlay hidden">
  <div class="subtitle">ego bruised</div>
  <div class="big-score" id="final-score">0</div>
  <div class="best" id="best-line">best 0</div>
  <div class="pulse">press any key to run it back</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
