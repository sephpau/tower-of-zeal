<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ego Run! — Model Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a0a2e; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px; }
  h1 { font-style: italic; font-weight: 900; margin-bottom: 4px;
       background: linear-gradient(180deg, #ffe97a, #ff5e7a);
       -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  p { opacity: 0.6; margin-bottom: 20px; font-size: 14px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: #2a1045; border-radius: 10px; overflow: hidden; border: 1px solid #4b2a7a; }
  .card canvas { display: block; width: 100%; height: 180px; cursor: grab; }
  .card .name { padding: 8px 12px; font-size: 13px; font-weight: 600; color: #ffe97a; }
  .card .meta { padding: 0 12px 10px; font-size: 11px; opacity: 0.55; }
</style>
</head>
<body>
<h1>EGO RUN! — model gallery</h1>
<p>every 3D object loaded by the game · drag any model to spin it</p>
<div id="grid"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODELS = [
  'tree-branched', 'tree-columnar', 'tree-conical', 'tree-open', 'tree-oval',
  'tree-pyramidal', 'tree-round', 'tree-spreading', 'tree-vase',
  'bicycle', 'bus', 'car_01', 'car_02', 'car_03', 'car_04', 'jeep_01', 'jeep_02',
  'pickup', 'truck_01', 'truck_02', 'truck_03', 'truck_04', 'truck_05',
];
const LEAF_COLORS = [0x2ea35e, 0x3ddc97, 0x47b86b, 0xff6fae, 0xc05ce0];
const BODY_COLORS = [0xff5e7a, 0x4dd0e1, 0xffd24a, 0xb04ddb, 0xf2f2f2, 0xff8c42];

const grid = document.getElementById('grid');
const loader = new GLTFLoader();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(400, 360);   // offscreen; rendered per-card then copied

const cells = [];   // { scene, camera, canvas, spin }

for (const name of MODELS) {
  const card = document.createElement('div');
  card.className = 'card';
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 360;
  const label = document.createElement('div');
  label.className = 'name';
  label.textContent = name;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = name.startsWith('tree') ? 'roadside decor + dodge obstacle' : 'road obstacle (dodge or hop)';
  card.append(canvas, label, meta);
  grid.append(card);

  loader.load(`assets/models/${name}.glb`, (gltf) => {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a1045);
    scene.add(new THREE.HemisphereLight(0xff9ad5, 0x3a1a5e, 1.1));
    const sun = new THREE.DirectionalLight(0xffd9a0, 1.8);
    sun.position.set(3, 6, 4);
    scene.add(sun);

    const root = gltf.scene;
    root.traverse((o) => { if (o.name === 'ground') o.visible = false; });
    // same coloring rules as the game
    const isTree = name.startsWith('tree');
    const leafMat = new THREE.MeshStandardMaterial({ color: LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)], roughness: 0.8 });
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3b2e, roughness: 0.9 });
    const painted = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6 });
    const body = new THREE.MeshStandardMaterial({ color: BODY_COLORS[Math.floor(Math.random() * BODY_COLORS.length)], roughness: 0.6 });
    root.traverse((o) => {
      if (!o.isMesh) return;
      if (isTree) o.material = o.name.includes('leaves') ? leafMat : trunkMat;
      else o.material = o.geometry.getAttribute('color') ? painted : body;
    });

    // center + frame
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const holder = new THREE.Group();
    root.position.sub(center);
    holder.add(root);
    scene.add(holder);

    const dim = Math.max(size.x, size.y, size.z);
    const camera = new THREE.PerspectiveCamera(40, 400 / 360, 0.01, 100);
    camera.position.set(dim * 1.1, dim * 0.7, dim * 1.4);
    camera.lookAt(0, 0, 0);

    const cell = { scene, camera, canvas, holder, active: false };
    cells.push(cell);
    drawCell(cell);   // render the thumbnail once

    // spin while hovered, drag to rotate by hand
    let dragging = false, lastX = 0;
    canvas.addEventListener('pointerenter', () => { cell.active = true; });
    canvas.addEventListener('pointerleave', () => { if (!dragging) cell.active = false; });
    canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; });
    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      holder.rotation.y += (e.clientX - lastX) * 0.02;
      lastX = e.clientX;
      drawCell(cell);
    });
    window.addEventListener('pointerup', () => { dragging = false; });
  });
}

function drawCell(c) {
  renderer.render(c.scene, c.camera);
  c.canvas.getContext('2d').drawImage(renderer.domElement, 0, 0);
}

// only the hovered card animates — everything else is a static thumbnail
function tick() {
  for (const c of cells) {
    if (!c.active) continue;
    c.holder.rotation.y += 0.02;
    drawCell(c);
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
