<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ego — Limb Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0a2e; }
  canvas { display: block; }
  #title {
    position: fixed; top: 16px; left: 20px;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
    pointer-events: none; user-select: none;
  }
  #title .t {
    font-size: 26px; font-weight: 900; font-style: italic;
    background: linear-gradient(180deg, #ffe97a 0%, #ffb02e 45%, #ff5e7a 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #title .s { font-size: 12px; opacity: 0.6; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 2px; }

  #panel {
    position: fixed; top: 16px; right: 16px; width: 290px;
    background: rgba(34, 14, 58, 0.92); border: 1px solid #4b2a7a; border-radius: 12px;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
    padding: 14px 16px; font-size: 13px;
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  #panel h3 { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #ffe97a; margin: 10px 0 6px; }
  #panel h3:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 0 0 88px; opacity: 0.85; }
  .row input[type=range] { flex: 1; accent-color: #ff5e7a; }
  .row .val { flex: 0 0 46px; text-align: right; font-variant-numeric: tabular-nums; color: #9ad6ff; }
  .row input[type=checkbox] { accent-color: #ff5e7a; width: 15px; height: 15px; }
  #stats { font-size: 11px; opacity: 0.7; line-height: 1.7; margin-top: 6px; white-space: pre; font-family: Consolas, monospace; }
  button {
    width: 100%; margin-top: 10px; padding: 9px 0;
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
    color: #fff; background: linear-gradient(180deg, #ff5e7a, #c0306a);
    border: none; border-radius: 8px; cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  #copied { text-align: center; font-size: 11px; color: #7affc0; height: 14px; margin-top: 4px; }
</style>
</head>
<body>
<div id="title">
  <div class="t">EGO — LIMB EDITOR</div>
  <div class="s">drag to orbit &middot; scroll to zoom</div>
</div>

<div id="panel">
  <h3>Cuts</h3>
  <div class="row"><label>facing yaw&deg;</label><input type="range" id="yaw" min="-180" max="180" step="5" value="-90"><span class="val" id="yawV"></span></div>
  <div class="row"><label>pitch&deg; (lean)</label><input type="range" id="pitch" min="-45" max="45" step="1" value="0"><span class="val" id="pitchV"></span></div>
  <div class="row"><label>roll&deg;</label><input type="range" id="roll" min="-45" max="45" step="1" value="0"><span class="val" id="rollV"></span></div>
  <div class="row"><label>leg top (hip)</label><input type="range" id="hip" min="0.05" max="0.7" step="0.01" value="0.50"><span class="val" id="hipV"></span></div>
  <div class="row"><label>leg gap width</label><input type="range" id="legInner" min="0" max="0.3" step="0.005" value="0"><span class="val" id="legInnerV"></span></div>
  <div class="row"><label>arm bottom</label><input type="range" id="armLo" min="0.2" max="0.9" step="0.01" value="0.50"><span class="val" id="armLoV"></span></div>
  <div class="row"><label>arm top</label><input type="range" id="armHi" min="0.3" max="1.0" step="0.01" value="0.80"><span class="val" id="armHiV"></span></div>
  <div class="row"><label>arm inner</label><input type="range" id="armInner" min="0.05" max="0.5" step="0.005" value="0.28"><span class="val" id="armInnerV"></span></div>

  <h3>Preview</h3>
  <div class="row"><label>run</label><input type="checkbox" id="animate" checked><span style="flex:1"></span></div>
  <div class="row"><label>colorize</label><input type="checkbox" id="colorize" checked><span style="flex:1"></span></div>
  <div class="row"><label>leg swing</label><input type="range" id="legSwing" min="0" max="1.2" step="0.05" value="0.7"><span class="val" id="legSwingV"></span></div>
  <div class="row"><label>arm swing</label><input type="range" id="armSwing" min="0" max="1.2" step="0.05" value="0.6"><span class="val" id="armSwingV"></span></div>
  <div class="row"><label>speed</label><input type="range" id="tempo" min="2" max="20" step="0.5" value="13"><span class="val" id="tempoV"></span></div>

  <div id="stats">loading model…</div>
  <button id="copy">copy settings JSON</button>
  <div id="copied"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0a2e);
scene.fog = new THREE.Fog(0x1a0a2e, 14, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.5, 2.2, 6.0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0x8877bb, 0.85));
const key = new THREE.DirectionalLight(0xfff2dd, 1.6);
key.position.set(4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
scene.add(key);
const rim = new THREE.DirectionalLight(0xff5e7a, 0.9);
rim.position.set(-5, 3, -4);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 48),
  new THREE.MeshStandardMaterial({ color: 0x241040, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(40, 40, 0x6a3aaa, 0x3a1a66);
grid.position.y = 0.01;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ---------- params (persisted) ----------
const PARAMS_KEY = 'egoLimbEditorParams';
const defaults = { yaw: -90, pitch: 0, roll: 0, hip: 0.50, legInner: 0, armLo: 0.50, armHi: 0.80, armInner: 0.28, legSwing: 0.7, armSwing: 0.6, tempo: 13 };
const params = { ...defaults, ...JSON.parse(localStorage.getItem(PARAMS_KEY) || '{}') };

const ids = ['yaw', 'pitch', 'roll', 'hip', 'legInner', 'armLo', 'armHi', 'armInner', 'legSwing', 'armSwing', 'tempo'];
for (const id of ids) {
  const el = document.getElementById(id);
  el.value = params[id];
  document.getElementById(id + 'V').textContent = params[id];
  el.addEventListener('input', () => {
    params[id] = parseFloat(el.value);
    document.getElementById(id + 'V').textContent = el.value;
    localStorage.setItem(PARAMS_KEY, JSON.stringify(params));
    if (['yaw', 'pitch', 'roll', 'hip', 'legInner', 'armLo', 'armHi', 'armInner'].includes(id)) requestSegment();
  });
}
const animateBox = document.getElementById('animate');
const colorizeBox = document.getElementById('colorize');
colorizeBox.addEventListener('change', applyColors);

// ---------- model: collect raw triangles once ----------
let rawTris = null;      // Float32Array, 9 floats per tri (baked node transforms, NO yaw)
let rawUVs = null;       // Float32Array, 6 floats per tri
let rawMat = null;       // Uint8Array, source-material index per tri
const srcMaterials = []; // original textured materials from the GLB
const holder = new THREE.Group();   // scaled/positioned container
scene.add(holder);
const limbs = { body: null, armL: null, armR: null, legL: null, legR: null };
const COLORS = { body: 0xd94f5c, armL: 0x4dd0e1, armR: 0x7a6aff, legL: 0xffe97a, legR: 0x4ad0a0 };
const colorMats = Object.fromEntries(Object.entries(COLORS).map(([k, c]) =>
  [k, new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0.08 })]));
const stats = document.getElementById('stats');

new GLTFLoader().load('ego.glb', (gltf) => {
  const root = gltf.scene;
  root.updateWorldMatrix(true, true);
  const posChunks = [], uvChunks = [], matCounts = [];
  root.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    const p = g.getAttribute('position').array;
    const uv = g.getAttribute('uv') ? g.getAttribute('uv').array : new Float32Array((p.length / 3) * 2);
    posChunks.push(p);
    uvChunks.push(uv);
    matCounts.push(p.length / 9);
    srcMaterials.push(o.material);
  });
  const total = posChunks.reduce((s, c) => s + c.length, 0);
  rawTris = new Float32Array(total);
  rawUVs = new Float32Array(total / 3 * 2);
  rawMat = new Uint8Array(total / 9);
  let o3 = 0, o2 = 0, ot = 0;
  for (let i = 0; i < posChunks.length; i++) {
    rawTris.set(posChunks[i], o3); o3 += posChunks[i].length;
    rawUVs.set(uvChunks[i], o2); o2 += uvChunks[i].length;
    rawMat.fill(i, ot, ot + matCounts[i]); ot += matCounts[i];
  }
  segment();
}, undefined, (err) => { stats.textContent = 'failed to load ego.glb: ' + err; });

// ---------- segmentation ----------
let segPending = false;
function requestSegment() {           // debounce slider storms to one per frame
  if (segPending) return;
  segPending = true;
  requestAnimationFrame(() => { segPending = false; segment(); });
}

function segment() {
  if (!rawTris) return;
  const yaw = params.yaw * Math.PI / 180;
  const pitch = params.pitch * Math.PI / 180;
  const roll = params.roll * Math.PI / 180;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const cr = Math.cos(roll), sr = Math.sin(roll);

  // pass 1: rotate (yaw -> pitch -> roll), find bbox
  const n = rawTris.length / 3;
  const pos = new Float32Array(rawTris.length);
  let minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
  for (let i = 0; i < n; i++) {
    const x = rawTris[i*3], y0 = rawTris[i*3+1], z = rawTris[i*3+2];
    // yaw around Y
    let rx = x * cy + z * sy, rz = -x * sy + z * cy, ry = y0;
    // pitch around X (straightens forward/back lean)
    const py_ = ry * cp - rz * sp, pz_ = ry * sp + rz * cp;
    ry = py_; rz = pz_;
    // roll around Z (straightens sideways lean)
    const qx_ = rx * cr - ry * sr, qy_ = rx * sr + ry * cr;
    rx = qx_; ry = qy_;
    pos[i*3] = rx; pos[i*3+1] = ry; pos[i*3+2] = rz;
    if (rx<minX)minX=rx; if (rx>maxX)maxX=rx;
    if (ry<minY)minY=ry; if (ry>maxY)maxY=ry;
    if (rz<minZ)minZ=rz; if (rz>maxZ)maxZ=rz;
  }
  const cx=(minX+maxX)/2, cz=(minZ+maxZ)/2, feetY=minY, H=maxY-minY, W=maxX-minX;
  const hipY = feetY + params.hip * H;
  const armLoY = feetY + params.armLo * H, armHiY = feetY + params.armHi * H;
  const armX = params.armInner * W, legX = params.legInner * W;

  // pass 2: bucket triangle indices
  const idx = { body: [], armL: [], armR: [], legL: [], legR: [] };
  const triCount = n / 3;
  for (let tIdx = 0; tIdx < triCount; tIdx++) {
    const b = tIdx * 9;
    const my = (pos[b+1] + pos[b+4] + pos[b+7]) / 3;
    const xr = (pos[b] + pos[b+3] + pos[b+6]) / 3 - cx;
    let key = 'body';
    if (my < hipY && Math.abs(xr) > legX) key = xr < 0 ? 'legL' : 'legR';
    else if (my >= armLoY && my < armHiY && Math.abs(xr) > armX) key = xr < 0 ? 'armL' : 'armR';
    idx[key].push(tIdx);
  }

  // pivots: limb centroid x, joint height
  const centroidX = (list) => {
    if (!list.length) return cx;
    let s = 0;
    for (const tIdx of list) { const b = tIdx*9; s += (pos[b] + pos[b+3] + pos[b+6]) / 3; }
    return s / list.length;
  };
  const pivots = {
    body: [cx, feetY, cz],
    legL: [centroidX(idx.legL), hipY, cz], legR: [centroidX(idx.legR), hipY, cz],
    armL: [centroidX(idx.armL), armHiY, cz], armR: [centroidX(idx.armR), armHiY, cz],
  };

  // rebuild meshes — one per (limb, source material) so textures survive the cut
  while (holder.children.length) holder.remove(holder.children[0]);
  const inner = new THREE.Group();
  const lines = [];
  for (const key of Object.keys(idx)) {
    const list = idx[key];
    const [px, py, pz] = pivots[key];
    const grp = new THREE.Group();
    grp.position.set(px, py, pz);
    const byMat = new Map();
    for (const tIdx of list) {
      const mi = rawMat[tIdx];
      if (!byMat.has(mi)) byMat.set(mi, []);
      byMat.get(mi).push(tIdx);
    }
    for (const [mi, tlist] of byMat) {
      const arr = new Float32Array(tlist.length * 9);
      const uvArr = new Float32Array(tlist.length * 6);
      for (let i = 0; i < tlist.length; i++) {
        const b = tlist[i] * 9, ub = tlist[i] * 6;
        for (let k = 0; k < 9; k += 3) {
          arr[i*9+k]   = pos[b+k]   - px;
          arr[i*9+k+1] = pos[b+k+1] - py;
          arr[i*9+k+2] = pos[b+k+2] - pz;
        }
        for (let k = 0; k < 6; k++) uvArr[i*6+k] = rawUVs[ub+k];
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, srcMaterials[mi]);
      mesh.userData.matIdx = mi;
      mesh.castShadow = true; mesh.receiveShadow = true;
      grp.add(mesh);
    }
    inner.add(grp);
    limbs[key] = grp;
    lines.push(`${key.padEnd(5)} ${String(list.length).padStart(7)} tris`);
  }
  inner.position.set(-cx, -feetY, -cz);
  holder.add(inner);
  holder.scale.setScalar(2.4 / H);
  applyColors();
  stats.textContent = lines.join('\n');
}

function applyColors() {
  const colored = colorizeBox.checked;
  for (const key of Object.keys(limbs)) {
    const grp = limbs[key];
    if (!grp) continue;
    for (const mesh of grp.children)
      mesh.material = colored ? colorMats[key] : srcMaterials[mesh.userData.matIdx];
  }
}

// ---------- copy settings ----------
document.getElementById('copy').addEventListener('click', async () => {
  const out = {
    yawDeg: params.yaw, pitchDeg: params.pitch, rollDeg: params.roll,
    hip: params.hip, legInner: params.legInner,
    armLo: params.armLo, armHi: params.armHi, armInner: params.armInner,
    legSwing: params.legSwing, armSwing: params.armSwing, tempo: params.tempo,
  };
  await navigator.clipboard.writeText(JSON.stringify(out, null, 2));
  const c = document.getElementById('copied');
  c.textContent = 'copied!';
  setTimeout(() => c.textContent = '', 1500);
});

// ---------- loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (limbs.legL) {
    if (animateBox.checked) {
      const stride = t * params.tempo;
      const a = Math.sin(stride);
      holder.position.y = Math.abs(a) * 0.1;
      limbs.legL.rotation.x = a * params.legSwing;
      limbs.legR.rotation.x = -a * params.legSwing;
      limbs.armL.rotation.x = -a * params.armSwing;
      limbs.armR.rotation.x = a * params.armSwing;
      limbs.body.rotation.x = -0.06 - Math.sin(stride * 2) * 0.03;
    } else {
      holder.position.y = 0;
      for (const k of Object.keys(limbs)) if (limbs[k]) limbs[k].rotation.x = 0;
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
