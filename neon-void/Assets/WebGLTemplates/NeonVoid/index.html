<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, user-scalable=no">
  <title>Zeal Survivors v2: The Void</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#120a24">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; background: #120a24; overflow: hidden;
      /* the browser must never claim a touch gesture (scroll / pull-to-refresh /
         back-swipe) — without this, drags freeze mid-gesture on mobile */
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    body { position: fixed; inset: 0; }
    #unity-container { position: absolute; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #05020d; touch-action: none; }

    /* ---------- loading overlay: logo + bar, nothing else ---------- */
    #nv-load {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 20%, #1c1133 0%, #120a24 60%, #0a0517 100%);
      font-family: "Luckiest Guy", system-ui, sans-serif;
      transition: opacity 0.7s ease;
    }
    #nv-load.done { opacity: 0; pointer-events: none; }

    #nv-center { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 24px; }

    .nv-zeal, .nv-surv {
      line-height: 0.95; margin: 0; text-align: center; letter-spacing: 0.03em;
      -webkit-text-stroke: 2px #241233;
      text-shadow: 0 6px 0 #241233, 0 10px 22px rgba(0, 0, 0, 0.55), 0 0 34px rgba(255, 200, 90, 0.18);
    }
    .nv-zeal { font-size: clamp(56px, 11vw, 120px); color: #d95c68; }
    .nv-surv { font-size: clamp(50px, 10vw, 108px); color: #f8c73f; }
    .nv-v2 {
      margin: 10px 0 26px; font-size: clamp(20px, 3.4vw, 34px); letter-spacing: 0.08em;
      color: #ff8cd9; text-align: center;
      -webkit-text-stroke: 1px #241233;
      text-shadow: 0 3px 0 #241233, 0 6px 14px rgba(0, 0, 0, 0.5);
    }

    #nv-bar-outer {
      width: min(520px, 74vw); height: 16px; border-radius: 999px;
      border: 2px solid rgba(248, 199, 63, 0.45);
      background: rgba(16, 8, 32, 0.85);
      box-shadow: 0 0 18px rgba(248, 199, 63, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    #nv-bar-fill {
      width: 0%; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #d95c68, #f8a53f 55%, #f8c73f);
      box-shadow: 0 0 14px rgba(248, 199, 63, 0.8);
      position: relative; transition: width 0.15s linear;
    }
    #nv-bar-fill::after {   /* moving sheen */
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: nv-sheen 1.4s linear infinite;
    }
    @keyframes nv-sheen { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    #nv-pct {
      margin-top: 10px; font-size: 15px; color: #b9a6d8; letter-spacing: 0.25em;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #nv-error { color: #ff8896; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; margin-top: 8px; text-align: center; }
    #nv-ver {
      position: absolute; left: 0; right: 0; bottom: 26px;
      text-align: center; font-size: 18px; letter-spacing: 0.12em;
      color: #ff8cd9; opacity: 0.85;
      -webkit-text-stroke: 1px #241233;
      text-shadow: 0 2px 0 #241233;
    }

    /* mobile: the game is landscape-only */
    #nv-rotate {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: #120a24; color: #f8c73f;
      font-family: "Luckiest Guy", system-ui, sans-serif; font-size: 30px;
      line-height: 1.5; letter-spacing: 0.05em;
    }
    @media (pointer: coarse) and (orientation: portrait) { #nv-rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="nv-rotate">ROTATE YOUR DEVICE<br>THE VOID IS LANDSCAPE ONLY</div>

  <div id="nv-load">
    <div id="nv-center">
      <div class="nv-zeal">ZEAL</div>
      <div class="nv-surv">SURVIVORS</div>
      <div class="nv-v2">V2 — THE VOID</div>
      <div id="nv-bar-outer"><div id="nv-bar-fill"></div></div>
      <div id="nv-pct">0%</div>
      <div id="nv-error"></div>
    </div>
    <div id="nv-ver">V{{{ PRODUCT_VERSION }}}</div>
  </div>

  <!-- Classic Zeal Survivors meta layer (same-origin): config + net + meta.
       Missing on local test hosts — every NVMeta* call below guards on window.SURV. -->
  <script src="/survive/js/config.js"></script>
  <script src="/survive/js/net.js"></script>
  <script src="/survive/js/meta.js"></script>

  <script>
    // ---------- Discord login (implicit OAuth, no backend needed) ----------
    // Paste your Discord Application's Client ID here (Developer Portal → OAuth2).
    // Leave empty to hide the login button in-game.
    var NV_DISCORD_CLIENT_ID = "1543811607426109521";

    (function () {
      // returning from Discord: token arrives in the URL fragment
      var m = /[#&]access_token=([^&]+)/.exec(location.hash || "");
      if (m) {
        history.replaceState(null, "", location.pathname + location.search);
        fetch("https://discord.com/api/users/@me", {
          headers: { Authorization: "Bearer " + decodeURIComponent(m[1]) }
        }).then(function (r) { return r.json(); }).then(function (u) {
          if (u && u.id) {
            localStorage.setItem("nv-discord-user", JSON.stringify({
              id: u.id, username: u.username || "",
              global_name: u.global_name || "", avatar: u.avatar || ""
            }));
            location.reload();   // let Unity boot with the identity in place
          }
        }).catch(function () {});
      }
    })();

    window.NVDiscordAvailable = function () { return NV_DISCORD_CLIENT_ID ? 1 : 0; };
    window.NVDiscordUser = function () { return localStorage.getItem("nv-discord-user") || ""; };
    window.NVDiscordLogout = function () { localStorage.removeItem("nv-discord-user"); };
    window.NVDiscordLogin = function () {
      if (!NV_DISCORD_CLIENT_ID) return;
      var redirect = location.origin + location.pathname;
      location.href = "https://discord.com/oauth2/authorize?client_id=" + NV_DISCORD_CLIENT_ID +
        "&response_type=token&scope=identify&redirect_uri=" + encodeURIComponent(redirect);
    };

    // ---------- Ronin wallet (same flow + storage keys as classic Zeal Survivors) ----------
    var NV_WALLET_KEY = 'motz_wallet', NV_WALLET_VERIFIED = 'motz_wallet_verified';
    window.__nvWalletBusy = false; window.__nvWalletError = "";
    function nvValidAddress(a) { a = (a || '').toLowerCase(); return /^0x[a-f0-9]{40}$/.test(a) ? a : ''; }
    function nvRoninProvider() {
      if (window.ronin && window.ronin.provider) return window.ronin.provider;
      if (window.ethereum) return window.ethereum;
      return null;
    }
    window.NVWalletAddress = function () { return nvValidAddress(localStorage.getItem(NV_WALLET_KEY)); };
    window.NVWalletBusy = function () { return window.__nvWalletBusy ? 1 : 0; };
    window.NVWalletTakeError = function () { var e = window.__nvWalletError; window.__nvWalletError = ""; return e; };
    window.NVWalletDisconnect = function () {
      localStorage.removeItem(NV_WALLET_KEY); localStorage.removeItem(NV_WALLET_VERIFIED);
      localStorage.removeItem('motz_voyages_wallet'); localStorage.removeItem('motz_voyages_wallet_verified');
      fetch('/api/staking/logout', { method: 'POST', credentials: 'same-origin' }).catch(function () {});
      var p = nvRoninProvider();
      if (p && p.request) p.request({ method: 'wallet_revokePermissions', params: [{ eth_accounts: {} }] }).catch(function () {});
    };
    window.NVWalletConnect = async function () {
      if (window.__nvWalletBusy) return;
      window.__nvWalletBusy = true; window.__nvWalletError = "";
      try {
        var provider = nvRoninProvider();
        if (!provider) throw new Error('Ronin Wallet not detected — open this page in a browser with the Ronin extension.');
        var accounts = await provider.request({ method: 'eth_requestAccounts' });
        var from = ((accounts && accounts[0]) || '').toLowerCase();
        if (!from) throw new Error('No wallet account connected.');
        try {
          await provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x7e4' }] });
        } catch (e) {
          if (e && e.code === 4902) {
            try {
              await provider.request({ method: 'wallet_addEthereumChain', params: [{
                chainId: '0x7e4', chainName: 'Ronin Mainnet',
                nativeCurrency: { name: 'Ronin', symbol: 'RON', decimals: 18 },
                rpcUrls: ['https://api.roninchain.com/rpc'],
                blockExplorerUrls: ['https://app.roninchain.com'] }] });
            } catch (_) {}
          }
        }
        var cr = await fetch('/api/staking/verify-wallet?address=' + encodeURIComponent(from), { credentials: 'same-origin' });
        if (!cr.ok) throw new Error('Could not start wallet verification.');
        var ch = await cr.json();
        var sig = await provider.request({ method: 'personal_sign', params: [ch.message, from] });
        var vr = await fetch('/api/staking/verify-wallet', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address: from, signature: sig, nonce: ch.nonce, timestamp: ch.timestamp })
        });
        var v = await vr.json().catch(function () { return {}; });
        if (!vr.ok || !v.verified) throw new Error(v.error || 'Wallet verification failed.');
        var addr = nvValidAddress(v.address || from);
        if (!addr) throw new Error('Wallet returned an invalid address.');
        var ts = String(Date.now());
        localStorage.setItem(NV_WALLET_KEY, addr); localStorage.setItem(NV_WALLET_VERIFIED, ts);
        localStorage.setItem('motz_voyages_wallet', addr); localStorage.setItem('motz_voyages_wallet_verified', ts);
      } catch (e) {
        var msg = (e && e.message) || 'Wallet connection failed.';
        window.__nvWalletError = ((e && e.code === 4001) || /cancel|denied|reject/i.test(msg)) ? 'Wallet connection cancelled.' : msg;
      } finally { window.__nvWalletBusy = false; }
    };

    // ---------- mobile: taps request fullscreen + landscape until it sticks ----------
    (function () {
      if (!window.matchMedia || !matchMedia('(pointer: coarse)').matches) return;
      function inFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
          (navigator.standalone === true));   // iOS home-screen app counts
      }
      function tryFullscreen() {
        if (inFullscreen()) return;
        var el = document.documentElement;
        var fs = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fs) { try { var p = fs.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        try {
          if (screen.orientation && screen.orientation.lock)
            screen.orientation.lock('landscape').catch(function () {});
        } catch (e) {}
      }
      // keep trying on every tap until fullscreen actually takes hold —
      // some browsers reject the first request during page load
      document.addEventListener('touchend', tryFullscreen, { passive: true });
      document.addEventListener('click', tryFullscreen, { passive: true });

      // belt-and-braces with the CSS touch-action: some browsers still start
      // a native pan/refresh gesture mid-drag, which freezes the game's touch
      // tracking until the finger lifts
      document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    })();

    // ---------- Adventure meta bridge (drives classic SURV.Meta from Unity) ----------
    window.__nvBoard = ""; window.__nvPass = "";
    window.NVMetaReady = function () { return (window.SURV && SURV.Meta && SURV.Meta.profile) ? 1 : 0; };
    window.NVMetaInit = function () {
      if (!window.SURV || !SURV.Meta) return;
      try {
        SURV.Meta.load();
        SURV.Net && SURV.Net.bindWalletEvents && SURV.Net.bindWalletEvents();
        SURV.Net && SURV.Net.loadProfile().catch(function () {});
      } catch (e) {}
    };
    window.NVMetaSummary = function () {
      if (!window.NVMetaReady()) return "";
      var P = SURV.Meta.profile, C = SURV.CONFIG;
      var ups = C.META_UPGRADES.map(function (u) {
        return { id: u.id, name: u.name, desc: u.desc, rank: (P.upgrades[u.id] || 0), maxRank: u.maxRank, cost: SURV.Meta.upgradeCost(u) };
      });
      var qs = (P.quests.ids || []).map(function (qid) {
        var q = C.QUEST_POOL.find(function (x) { return x.id === qid; }) || {};
        return { id: qid, desc: q.desc || qid, gold: q.gold || 0, xp: q.xp || 0,
          done: P.quests.done.indexOf(qid) >= 0, claimed: P.quests.claimed.indexOf(qid) >= 0 };
      });
      return JSON.stringify({
        gold: P.gold || 0, name: P.name || "",
        passXp: P.pass.xp || 0, passTier: SURV.Meta.passTier(), passTiers: C.SEASON.passTiers,
        xpPerTier: C.SEASON.xpPerTier, premium: !!P.pass.premium,
        seasonName: C.SEASON.name, seasonId: C.SEASON.id, priceRon: C.SEASON.premiumPriceRon,
        claimable: SURV.Meta.claimableRewards().length,
        lifetimeKills: P.lifetime.kills || 0, lifetimeRuns: P.lifetime.runs || 0, bestScore: P.lifetime.bestScore || 0,
        upgrades: ups, quests: qs
      });
    };
    window.NVMetaBuy = function (id) {
      if (!window.NVMetaReady()) return '{"ok":false,"err":"offline"}';
      return JSON.stringify(SURV.Meta.buyUpgrade(id));
    };
    window.NVMetaClaimQuest = function (id) {
      if (!window.NVMetaReady()) return '{"ok":false}';
      return JSON.stringify({ ok: SURV.Meta.claimQuest(id).ok });
    };
    window.NVMetaClaimRewards = function () {
      if (!window.NVMetaReady()) return '{"ok":false,"count":0}';
      var n = 0;
      SURV.Meta.claimableRewards().forEach(function (c) {
        if (SURV.Meta.claimReward(c.track, c.tier).ok) n++;
      });
      return JSON.stringify({ ok: true, count: n });
    };
    window.NVMetaBonuses = function () { return window.NVMetaReady() ? JSON.stringify(SURV.Meta.bonuses()) : "{}"; };

    // per-survivor training: namespaced ranks inside the same cloud profile
    // (upgrades["sv:<pilot>:<track>"]), so cross-device merge keeps working
    var NV_SURV_TRACKS = [
      { id: 'power',    name: 'Power Training',    desc: '+6% damage / rank',   per: 0.06, base: 250, maxRank: 3 },
      { id: 'vitality', name: 'Vitality Training', desc: '+10% max HP / rank',  per: 0.10, base: 250, maxRank: 3 },
      { id: 'tempo',    name: 'Tempo Training',    desc: '-3% cooldown / rank', per: 0.03, base: 350, maxRank: 3 }
    ];
    function nvSurvKey(pilot, track) { return 'sv:' + pilot + ':' + track; }
    window.NVMetaSurvivors = function (pilotId) {
      if (!window.NVMetaReady()) return "";
      var P = SURV.Meta.profile;
      return JSON.stringify({ pilot: pilotId, gold: P.gold || 0, tracks: NV_SURV_TRACKS.map(function (t) {
        var rank = P.upgrades[nvSurvKey(pilotId, t.id)] || 0;
        return { id: t.id, name: t.name, desc: t.desc, rank: rank, maxRank: t.maxRank,
                 cost: Math.round(t.base * Math.pow(1.7, rank)) };
      }) });
    };
    window.NVMetaBuySurvivor = function (pilotId, trackId) {
      if (!window.NVMetaReady()) return '{"ok":false,"err":"offline"}';
      var P = SURV.Meta.profile;
      var t = NV_SURV_TRACKS.find(function (x) { return x.id === trackId; });
      if (!t) return '{"ok":false,"err":"unknown"}';
      var key = nvSurvKey(pilotId, trackId), rank = P.upgrades[key] || 0;
      if (rank >= t.maxRank) return '{"ok":false,"err":"Maxed out"}';
      var cost = Math.round(t.base * Math.pow(1.7, rank));
      if ((P.gold || 0) < cost) return '{"ok":false,"err":"Not enough gold"}';
      P.gold -= cost;
      P.upgrades[key] = rank + 1;
      SURV.Meta.save();
      SURV.Meta.syncSoon();
      return '{"ok":true}';
    };
    // per-ship armory: same idea as survivor training — ranks live at
    // "ship:<pilot>:<id>". Existing shared ranks migrate once to ALL ships
    // so nobody loses progress they already paid for.
    var NV_SHIP_IDS = ['might', 'maxhp', 'armor', 'recovery', 'cooldown', 'area', 'speed'];
    function nvShipKey(pilot, id) { return 'ship:' + pilot + ':' + id; }
    function nvShipDefs() {
      return SURV.CONFIG.META_UPGRADES.filter(function (u) { return NV_SHIP_IDS.indexOf(u.id) >= 0; });
    }
    function nvMigrateShip() {
      var P = SURV.Meta.profile;
      if (P.upgrades['ship:migrated']) return;
      var pilots = ['ego', 'captain', 'chef', 'lunar'];
      nvShipDefs().forEach(function (u) {
        var shared = P.upgrades[u.id] || 0;
        if (shared > 0) pilots.forEach(function (p) {
          var k = nvShipKey(p, u.id);
          P.upgrades[k] = Math.max(P.upgrades[k] || 0, shared);
        });
      });
      P.upgrades['ship:migrated'] = 1;
      SURV.Meta.save(); SURV.Meta.syncSoon();
    }
    window.NVMetaShip = function (pilotId) {
      if (!window.NVMetaReady()) return "";
      nvMigrateShip();
      var P = SURV.Meta.profile;
      return JSON.stringify({ pilot: pilotId, gold: P.gold || 0, tracks: nvShipDefs().map(function (u) {
        var rank = P.upgrades[nvShipKey(pilotId, u.id)] || 0;
        return { id: u.id, name: u.name, desc: u.desc, rank: rank, maxRank: u.maxRank,
                 cost: Math.round(u.base * Math.pow(SURV.CONFIG.META_COST_GROWTH, rank)) };
      }) });
    };
    window.NVMetaBuyShip = function (pilotId, id) {
      if (!window.NVMetaReady()) return '{"ok":false,"err":"offline"}';
      nvMigrateShip();
      var P = SURV.Meta.profile;
      var u = nvShipDefs().find(function (x) { return x.id === id; });
      if (!u) return '{"ok":false,"err":"unknown"}';
      var key = nvShipKey(pilotId, id), rank = P.upgrades[key] || 0;
      if (rank >= u.maxRank) return '{"ok":false,"err":"Maxed out"}';
      var cost = Math.round(u.base * Math.pow(SURV.CONFIG.META_COST_GROWTH, rank));
      if ((P.gold || 0) < cost) return '{"ok":false,"err":"Not enough gold"}';
      P.gold -= cost;
      P.upgrades[key] = rank + 1;
      SURV.Meta.save(); SURV.Meta.syncSoon();
      return '{"ok":true}';
    };
    window.NVMetaShipBonuses = function (pilotId) {
      if (!window.NVMetaReady()) return "{}";
      nvMigrateShip();
      var P = SURV.Meta.profile, out = {};
      nvShipDefs().forEach(function (u) {
        var r = P.upgrades[nvShipKey(pilotId, u.id)] || 0;
        if (r > 0) out[u.id] = u.per * r;
      });
      return JSON.stringify(out);
    };
    window.NVMetaCrewBonuses = function () {
      if (!window.NVMetaReady()) return "{}";
      var b = SURV.Meta.bonuses(), out = {};
      ['magnet', 'xpgain', 'greed'].forEach(function (k) { if (b[k]) out[k] = b[k]; });
      return JSON.stringify(out);
    };
    window.NVMetaSurvivorBonuses = function (pilotId) {
      if (!window.NVMetaReady()) return "{}";
      var P = SURV.Meta.profile, out = {};
      NV_SURV_TRACKS.forEach(function (t) {
        var r = P.upgrades[nvSurvKey(pilotId, t.id)] || 0;
        if (r > 0) out[t.id] = t.per * r;
      });
      return JSON.stringify(out);
    };
    window.NVMetaAbsorbRun = function (json) {
      if (!window.NVMetaReady()) return '{"ok":false}';
      try {
        var out = SURV.Meta.absorbRun(JSON.parse(json), null);
        return JSON.stringify({ ok: true, passXp: out.passXp, gold: out.goldGained,
          quests: out.questsDone.map(function (q) { return q.desc; }) });
      } catch (e) { return '{"ok":false}'; }
    };
    // connected Discord names the pilot automatically — profile + leaderboard
    (function () {
      function applyDiscordName() {
        try {
          var raw = localStorage.getItem("nv-discord-user");
          if (!raw) return true;   // no Discord — nothing to do
          if (!window.NVMetaReady()) return false;   // meta not loaded yet, retry
          var u = JSON.parse(raw);
          var n = u.global_name || u.username || "";
          if (n) { SURV.Meta.setName(n); if (SURV.Meta.syncSoon) SURV.Meta.syncSoon(); }
          return true;
        } catch (e) { return true; }
      }
      var iv = setInterval(function () { if (applyDiscordName()) clearInterval(iv); }, 1000);
    })();

    window.NVRunStart = function () {
      if (window.NVMetaReady() && SURV.Net) SURV.Net.startRun().catch(function () {});
    };
    window.NVRunSubmit = function (json) {
      if (!window.NVMetaReady() || !SURV.Net) return;
      try { SURV.Net.submitScore(JSON.parse(json)).catch(function () {}); } catch (e) {}
    };
    window.NVBoardFetch = function (period) {
      window.__nvBoard = "";
      if (!window.NVMetaReady() || !SURV.Net) { window.__nvBoard = '{"ok":false,"reason":"offline"}'; return; }
      SURV.Net.fetchBoard(period)
        .then(function (d) { window.__nvBoard = JSON.stringify(d); })
        .catch(function () { window.__nvBoard = '{"ok":false,"reason":"offline"}'; });
    };
    window.NVBoardTake = function () { return window.__nvBoard; };
    window.NVPassBuy = function () {
      window.__nvPass = '{"busy":true,"status":"Starting purchase…"}';
      if (!window.NVMetaReady() || !SURV.Net) { window.__nvPass = '{"busy":false,"ok":false,"reason":"offline"}'; return; }
      SURV.Net.purchasePass(function (st) { window.__nvPass = JSON.stringify({ busy: true, status: st }); })
        .then(function (r) {
          if (r.ok) SURV.Meta.setPremium();
          window.__nvPass = JSON.stringify({ busy: false, ok: !!r.ok, reason: r.reason || "" });
        });
    };
    window.NVPassStatus = function () { return window.__nvPass; };
    window.NVMetaPassTrack = function () {
      if (!window.NVMetaReady()) return "";
      var P = SURV.Meta.profile, C = SURV.CONFIG, tier = SURV.Meta.passTier();
      function label(R) {
        if (!R) return "";
        if (R.name) return R.name;
        var bits = [];
        if (R.gold) bits.push(R.gold.toLocaleString() + " gold");
        if (R.reroll) bits.push("+" + R.reroll + " reroll" + (R.reroll > 1 ? "s" : ""));
        if (R.banish) bits.push("+" + R.banish + " banish" + (R.banish > 1 ? "es" : ""));
        if (R.revival) bits.push("+" + R.revival + " revival");
        return bits.join(", ");
      }
      // every tier × both tracks — the client draws the full board like v1
      var rows = [];
      for (var t = 1; t <= C.SEASON.passTiers; t++) {
        ["free", "premium"].forEach(function (track) {
          var R = C.PASS_REWARDS[track][t];
          var claimed = P.pass.claimed[track].indexOf(t) >= 0;
          rows.push({ tier: t, track: track, label: R ? label(R) : "", has: !!R, claimed: claimed,
            claimable: !!R && !claimed && t <= tier && (track === "free" || P.pass.premium) });
        });
      }
      return JSON.stringify({ rows: rows, tier: tier, tiers: C.SEASON.passTiers, premium: !!P.pass.premium });
    };
    window.NVMetaClaimTier = function (track, t) {
      if (!window.NVMetaReady()) return '{"ok":false}';
      return JSON.stringify({ ok: !!SURV.Meta.claimReward(String(track), Number(t)).ok });
    };
    window.NVMetaInit();

    // ---------- progress (smoothed toward loader's target) ----------
    // setInterval, not rAF: rAF freezes in background tabs, and the bar
    // should keep moving if the player loads the game behind another tab
    var nvFill = document.getElementById("nv-bar-fill");
    var nvPct = document.getElementById("nv-pct");
    var nvTarget = 0, nvShown = 0;
    var nvBarTimer = setInterval(function () {
      if (nvShown < nvTarget) {
        nvShown = Math.min(nvTarget, nvShown + 0.008 + (nvTarget - nvShown) * 0.08);
        nvFill.style.width = (nvShown * 100).toFixed(1) + "%";
        nvPct.textContent = Math.round(nvShown * 100) + "%";
      }
      if (nvShown >= 1) clearInterval(nvBarTimer);
    }, 40);

    // ---------- Unity boot ----------
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        nvTarget = Math.max(nvTarget, progress);
      }).then(function (unityInstance) {
        nvTarget = 1; nvShown = 1;
        nvFill.style.width = "100%"; nvPct.textContent = "100%";
        setTimeout(function () {
          var overlay = document.getElementById("nv-load");
          overlay.classList.add("done");
          setTimeout(function () { overlay.remove(); }, 800);
        }, 300);
      }).catch(function (message) {
        document.getElementById("nv-error").textContent = message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
