<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, user-scalable=no">
  <title>Zeal Survivors v2: The Void</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #120a24; overflow: hidden; }
    #unity-container { position: absolute; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #05020d; }

    /* ---------- loading overlay: logo + bar, nothing else ---------- */
    #nv-load {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 20%, #1c1133 0%, #120a24 60%, #0a0517 100%);
      font-family: "Luckiest Guy", system-ui, sans-serif;
      transition: opacity 0.7s ease;
    }
    #nv-load.done { opacity: 0; pointer-events: none; }

    #nv-center { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 24px; }

    .nv-zeal, .nv-surv {
      line-height: 0.95; margin: 0; text-align: center; letter-spacing: 0.03em;
      -webkit-text-stroke: 2px #241233;
      text-shadow: 0 6px 0 #241233, 0 10px 22px rgba(0, 0, 0, 0.55), 0 0 34px rgba(255, 200, 90, 0.18);
    }
    .nv-zeal { font-size: clamp(56px, 11vw, 120px); color: #d95c68; }
    .nv-surv { font-size: clamp(50px, 10vw, 108px); color: #f8c73f; }
    .nv-v2 {
      margin: 10px 0 26px; font-size: clamp(20px, 3.4vw, 34px); letter-spacing: 0.08em;
      color: #ff8cd9; text-align: center;
      -webkit-text-stroke: 1px #241233;
      text-shadow: 0 3px 0 #241233, 0 6px 14px rgba(0, 0, 0, 0.5);
    }

    #nv-bar-outer {
      width: min(520px, 74vw); height: 16px; border-radius: 999px;
      border: 2px solid rgba(248, 199, 63, 0.45);
      background: rgba(16, 8, 32, 0.85);
      box-shadow: 0 0 18px rgba(248, 199, 63, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    #nv-bar-fill {
      width: 0%; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #d95c68, #f8a53f 55%, #f8c73f);
      box-shadow: 0 0 14px rgba(248, 199, 63, 0.8);
      position: relative; transition: width 0.15s linear;
    }
    #nv-bar-fill::after {   /* moving sheen */
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: nv-sheen 1.4s linear infinite;
    }
    @keyframes nv-sheen { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    #nv-pct {
      margin-top: 10px; font-size: 15px; color: #b9a6d8; letter-spacing: 0.25em;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #nv-error { color: #ff8896; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="nv-load">
    <div id="nv-center">
      <div class="nv-zeal">ZEAL</div>
      <div class="nv-surv">SURVIVORS</div>
      <div class="nv-v2">V2 — THE VOID</div>
      <div id="nv-bar-outer"><div id="nv-bar-fill"></div></div>
      <div id="nv-pct">0%</div>
      <div id="nv-error"></div>
    </div>
  </div>

  <script>
    // ---------- Discord login (implicit OAuth, no backend needed) ----------
    // Paste your Discord Application's Client ID here (Developer Portal → OAuth2).
    // Leave empty to hide the login button in-game.
    var NV_DISCORD_CLIENT_ID = "1543811607426109521";

    (function () {
      // returning from Discord: token arrives in the URL fragment
      var m = /[#&]access_token=([^&]+)/.exec(location.hash || "");
      if (m) {
        history.replaceState(null, "", location.pathname + location.search);
        fetch("https://discord.com/api/users/@me", {
          headers: { Authorization: "Bearer " + decodeURIComponent(m[1]) }
        }).then(function (r) { return r.json(); }).then(function (u) {
          if (u && u.id) {
            localStorage.setItem("nv-discord-user", JSON.stringify({
              id: u.id, username: u.username || "",
              global_name: u.global_name || "", avatar: u.avatar || ""
            }));
            location.reload();   // let Unity boot with the identity in place
          }
        }).catch(function () {});
      }
    })();

    window.NVDiscordAvailable = function () { return NV_DISCORD_CLIENT_ID ? 1 : 0; };
    window.NVDiscordUser = function () { return localStorage.getItem("nv-discord-user") || ""; };
    window.NVDiscordLogout = function () { localStorage.removeItem("nv-discord-user"); };
    window.NVDiscordLogin = function () {
      if (!NV_DISCORD_CLIENT_ID) return;
      var redirect = location.origin + location.pathname;
      location.href = "https://discord.com/oauth2/authorize?client_id=" + NV_DISCORD_CLIENT_ID +
        "&response_type=token&scope=identify&redirect_uri=" + encodeURIComponent(redirect);
    };

    // ---------- progress (smoothed toward loader's target) ----------
    // setInterval, not rAF: rAF freezes in background tabs, and the bar
    // should keep moving if the player loads the game behind another tab
    var nvFill = document.getElementById("nv-bar-fill");
    var nvPct = document.getElementById("nv-pct");
    var nvTarget = 0, nvShown = 0;
    var nvBarTimer = setInterval(function () {
      if (nvShown < nvTarget) {
        nvShown = Math.min(nvTarget, nvShown + 0.008 + (nvTarget - nvShown) * 0.08);
        nvFill.style.width = (nvShown * 100).toFixed(1) + "%";
        nvPct.textContent = Math.round(nvShown * 100) + "%";
      }
      if (nvShown >= 1) clearInterval(nvBarTimer);
    }, 40);

    // ---------- Unity boot ----------
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        nvTarget = Math.max(nvTarget, progress);
      }).then(function (unityInstance) {
        nvTarget = 1; nvShown = 1;
        nvFill.style.width = "100%"; nvPct.textContent = "100%";
        setTimeout(function () {
          var overlay = document.getElementById("nv-load");
          overlay.classList.add("done");
          setTimeout(function () { overlay.remove(); }, 800);
        }, 300);
      }).catch(function (message) {
        document.getElementById("nv-error").textContent = message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
