<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Strike</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0520; touch-action: none; }
  #game-canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff; z-index: 10;
    background: radial-gradient(ellipse at center, rgba(11,5,32,0.55) 0%, rgba(11,5,32,0.88) 100%);
    user-select: none;
  }
  .hidden { display: none !important; }

  .title {
    font-size: clamp(48px, 11vw, 104px);
    font-weight: 900; font-style: italic;
    letter-spacing: 0.04em;
    background: linear-gradient(180deg, #7dfcff 0%, #4aa8ff 40%, #ff4ecd 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 rgba(40, 10, 90, 0.95)) drop-shadow(0 10px 26px rgba(0,0,0,0.55));
    transform: skewX(-6deg);
    text-transform: uppercase;
  }
  .subtitle { font-size: clamp(13px, 3vw, 19px); opacity: 0.85; margin-top: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: #9be8ff; }
  .hint { font-size: clamp(13px, 2.6vw, 16px); opacity: 0.7; margin-top: 34px; line-height: 2; text-align: center; }
  .hint b { color: #ffd76a; font-weight: 700; }
  .pulse { margin-top: 28px; font-size: clamp(16px, 3.4vw, 22px); font-weight: 700; color: #7dfcff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.96); } }

  .big-score { font-size: clamp(44px, 10vw, 88px); font-weight: 900; color: #7dfcff; text-shadow: 0 0 24px rgba(125,252,255,0.6), 0 4px 18px rgba(0,0,0,0.6); }
  .best { font-size: clamp(15px, 3vw, 20px); margin-top: 10px; opacity: 0.8; }
  .new-best { color: #ff4ecd; font-weight: 800; animation: pulse 1s ease-in-out infinite; }
  .go-title { font-size: clamp(34px, 8vw, 66px); font-weight: 900; letter-spacing: 0.08em; color: #ff5e7a; text-shadow: 0 0 30px rgba(255,78,205,0.55); text-transform: uppercase; font-style: italic; }
  .stats-line { margin-top: 16px; font-size: clamp(14px, 2.8vw, 18px); opacity: 0.85; letter-spacing: 0.05em; }

  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
  }
  #score {
    position: absolute; top: 16px; left: 20px;
    font-size: clamp(22px, 4.5vw, 34px); font-weight: 900;
    color: #7dfcff; text-shadow: 0 0 14px rgba(125,252,255,0.7), 0 2px 6px rgba(0,0,0,0.6);
    font-style: italic; letter-spacing: 0.04em;
  }
  #wave {
    position: absolute; top: 16px; right: 20px; text-align: right;
    font-size: clamp(14px, 3vw, 20px); font-weight: 700;
    color: #ff9de0; text-shadow: 0 0 12px rgba(255,78,205,0.7), 0 2px 6px rgba(0,0,0,0.6);
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  #combo {
    position: absolute; top: 58px; left: 22px;
    font-size: clamp(14px, 3vw, 20px); font-weight: 800;
    color: #ffd76a; text-shadow: 0 0 12px rgba(255,215,106,0.7);
    font-style: italic; opacity: 0; transition: opacity 0.25s;
  }
  #shield-wrap {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: min(300px, 55vw); height: 12px;
    border: 2px solid rgba(125,252,255,0.55); border-radius: 8px;
    background: rgba(10,5,30,0.6); overflow: hidden;
    box-shadow: 0 0 16px rgba(125,252,255,0.25);
  }
  #shield-bar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #4aa8ff, #7dfcff);
    box-shadow: 0 0 12px rgba(125,252,255,0.8);
    transition: width 0.2s ease, background 0.2s;
  }
  #power {
    position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%);
    font-size: clamp(12px, 2.6vw, 16px); font-weight: 800; letter-spacing: 0.2em;
    color: #ffd76a; text-shadow: 0 0 12px rgba(255,215,106,0.8); text-transform: uppercase;
    opacity: 0; transition: opacity 0.2s;
  }
  #wave-banner {
    position: absolute; top: 34%; left: 0; right: 0; text-align: center;
    font-size: clamp(30px, 7vw, 58px); font-weight: 900; font-style: italic;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: #ff4ecd; text-shadow: 0 0 30px rgba(255,78,205,0.8), 0 4px 14px rgba(0,0,0,0.6);
    opacity: 0; pointer-events: none;
  }
  #wave-banner.show { animation: banner 1.8s ease-out forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: scale(0.7); }
    18% { opacity: 1; transform: scale(1.06); }
    30% { transform: scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.04); }
  }
  #mute {
    position: absolute; bottom: 16px; right: 18px; pointer-events: auto; cursor: pointer;
    font-size: 13px; letter-spacing: 0.1em; opacity: 0.55; color: #9be8ff;
  }
  #damage-vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    box-shadow: inset 0 0 120px 40px rgba(255, 40, 90, 0.55);
    opacity: 0; transition: opacity 0.35s;
  }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud">
  <div id="score">0</div>
  <div id="wave">Wave 1</div>
  <div id="combo"></div>
  <div id="power"></div>
  <div id="wave-banner"></div>
  <div id="shield-wrap"><div id="shield-bar"></div></div>
  <div id="mute">[M] SOUND ON</div>
</div>
<div id="damage-vignette"></div>

<div id="start-overlay" class="overlay">
  <div class="title">Space Strike</div>
  <div class="subtitle">Neon Void &nbsp;//&nbsp; Sector 7</div>
  <div class="hint">
    <b>Mouse / drag</b> — steer your ship<br>
    <b>Click / Space</b> — hold to fire &nbsp;·&nbsp; <b>M</b> — mute<br>
    Blast drones &amp; asteroids · grab power cores · survive the waves
  </div>
  <div class="pulse">CLICK TO LAUNCH</div>
</div>

<div id="gameover-overlay" class="overlay hidden">
  <div class="go-title">Ship Destroyed</div>
  <div class="big-score" id="final-score">0</div>
  <div class="best" id="best-line">Best: 0</div>
  <div class="stats-line" id="stats-line"></div>
  <div class="pulse">CLICK TO RELAUNCH</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module" src="game.js"></script>
</body>
</html>
